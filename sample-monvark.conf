[Application Options]

; ------------------------------------------------------------------------------
; General settings
; ------------------------------------------------------------------------------

; Debug logging level.  Logging goes to stdout; redirect it if you want a file.
; Valid levels are {trace, debug, info, warn, error, critical}
; debuglevel=info

; Device to use, can be a comma seperated list for multiple devices.
; Left unset, monvark asks once at a terminal which devices to mine with and
; writes the answer here -- but only where there is more than one device to
; choose between.  On a single-device machine nothing is asked and no line
; appears here, which is not a failure.  Where there is nobody to ask -- a
; service unit, a container, a redirected run -- every device found is used
; instead, including the CPU and the graphics that draw a screen, which can
; leave a machine somebody is sitting at unresponsive.  Run monvark -l to see
; the indices.
; devices=0,1

; Full path to the OpenCL library to load, for installations the built-in
; search does not cover.
; opencl-lib=/some/path/libOpenCL.so

; ------------------------------------------------------------------------------
; Network settings
; ------------------------------------------------------------------------------

; Use testnet (cannot be used with simnet=1).
; testnet=1

; Use simnet (cannot be used with testnet=1).
; simnet=1

; ------------------------------------------------------------------------------
; Profiling settings
; ------------------------------------------------------------------------------

; Enable full profile on specified port.
; profile=1234

; Write cpu profile.
; cpuprofile=/some/path

; ------------------------------------------------------------------------------
; Status API
; ------------------------------------------------------------------------------

; Specify the interface for the API server to listen on.  If you don't specify
; a port, it uses the default 3333.  Leaving this unset -- or set to an empty
; value -- disables the status API.
;
;   All interfaces on the default port:
; apilisten=:
;   Only ipv4 localhost on the default port:
; apilisten=127.0.0.1
;   All interfaces on a non-standard port:
; apilisten=:8337

; ------------------------------------------------------------------------------
; Mining settings
; ------------------------------------------------------------------------------

; The address block rewards are paid to.  monvark asks for this once on first
; run and writes it here; you can also set it yourself before the first run.
; Edit this and restart to change it; a --miningaddr that disagrees with it is
; a startup error, not an override.
; miningaddr=

; Path to the mond binary.  Only needed for a development build of monvark:
; the release archive always ships mond next to it.
; mond=

; Autocalibrate time target in ms to spend executing hashes for each
; iteration.  Used only when neither intensity nor worksize is set below.
; autocalibrate=500

; Intensity (the work size is 2^intensity).  One global value, or one entry per
; device as a comma separated list.
; intensity=26
; intensity=26,25

; Worksize of the work to do (overrides intensity).  One global value, or one
; entry per device as a comma separated list.
; worksize=33554176
; worksize=33554176,16777088

; Percentage of the time a device hashes, 1-100; the rest of the time it idles.
; The default of 100 runs it flat out.  This is the only setting that throttles
; a device -- intensity and worksize do not.  One global value, or one entry per
; device as a comma separated list.
; dutycycle=50
; dutycycle=25,100

; Benchmark mode only (do no real work, submit nothing to the node).
; benchmark=1
