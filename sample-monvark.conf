[Application Options]

; ------------------------------------------------------------------------------
; General settings
; ------------------------------------------------------------------------------

; Location of logfiles.
; logdir=/some/path

; Debug logging level.
; Valid levels are {trace, debug, info, warn, error, critical}
; You may also specify <subsystem>=<level>,<subsystem2>=<level>,... to set
; log level for individual subsystems.  Use monvark --debuglevel=show to list
; available subsystems.
; debuglevel=info

; Connect via a SOCKS5 proxy.
; proxy=127.0.0.1:9050
; proxyuser=
; proxypass=

; Device to use, can be a comma seperated list for multiple devices.
; All devices found are used if this is left unset.
; devices=0,1

; Full path to the OpenCL library to load, for installations the built-in
; search does not cover.
; opencl-lib=/some/path/libOpenCL.so

; ------------------------------------------------------------------------------
; Network settings
; ------------------------------------------------------------------------------

; Use testnet (cannot be used with simnet=1).
; testnet=1

; Use simnet (cannot be used with testnet=1).
; simnet=1

; ------------------------------------------------------------------------------
; Profiling settings
; ------------------------------------------------------------------------------

; Enable full profile on specified port.
; profile=1234

; Write cpu profile.
; cpuprofile=/some/path

; Write memory profile.
; memprofile=/some/path

; ------------------------------------------------------------------------------
; Status API
; ------------------------------------------------------------------------------

; Specify the interfaces for the API server to listen on, one address per
; line.  If you don't specify a port, it uses the default 3333.
;
;   All interfaces on the default port:
; apilisten=
;   Only ipv4 localhost on the default port:
; apilisten=127.0.0.1
;   All interfaces on a non-standard port:
; apilisten=:8337

; ------------------------------------------------------------------------------
; RPC client settings
; ------------------------------------------------------------------------------

; Username and password to authenticate connections to the Monetarium node's
; (mond) RPC server.
; rpcuser=
; rpcpass=

; RPC server to connect to
; rpcserver=localhost

; RPC server certificate chain file for validation
; rpccert=~/.monetarium/rpc.cert

; ------------------------------------------------------------------------------
; Mining settings
; ------------------------------------------------------------------------------

; Autocalibrate time target in ms to spend executing hashes for each
; iteration.  Used only when neither intensity nor worksize is set below.
; autocalibrate=500

; Intensity (the work size is 2^intensity) with one entry per device.
; intensity=26
; intensity=25

; Worksize sizes of the work to (overrides intensity) with one entry per device.
; worksize=33554176
; worksize=33554176

; Benchmark mode only (do no real work, submit nothing to the node).
; benchmark=1
