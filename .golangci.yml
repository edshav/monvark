version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - containedctx
    - dupword
    - durationcheck
    - errorlint
    - godot
    - grouper
    - ineffassign
    - makezero
    - misspell
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused

formatters:
  enable:
    - gofmt
    - goimports
