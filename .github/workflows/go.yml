name: Build and Test
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: 'stable'
      - name: Install linters
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Test and lint
        run: ./run_tests.sh

  build:
    name: Build every shipped platform
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          # The go.mod floor rather than 'stable', so every shipped platform is
          # built by the oldest toolchain the module claims to support.
          go-version-file: 'go.mod'
      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -o dist/monvark-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/monvark-windows-amd64.exe .
          # macOS is a development target, not a shipped artifact (spec §6), so
          # it is only compiled here to keep loader_unix.go honest.
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o /dev/null .
          ls -l dist
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: monvark-binaries
          path: dist/
